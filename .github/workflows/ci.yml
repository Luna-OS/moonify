name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Für die Tests wird die Electron-Binärdatei nicht gebraucht
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
