name: Release

# Wird durch einen Versions-Tag (z. B. v0.1.0) ausgelöst:
# baut Moonify für Windows, macOS und Linux und veröffentlicht ein GitHub-Release.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Tag und package.json-Version vergleichen
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME passt nicht zur Version $version in package.json"
            exit 1
          fi
      - run: npm ci
      - run: npm test
      - name: Installationsdateien bauen
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
      - uses: actions/upload-artifact@v4
        with:
          name: moonify-${{ matrix.os }}
          if-no-files-found: error
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb

  release:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Release-Notizen aus CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '/^## /{p = ($2 == v)} p' CHANGELOG.md | tail -n +2 > notes.md
          test -s notes.md || echo "Moonify $GITHUB_REF_NAME" > notes.md
          cat notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Moonify ${{ github.ref_name }}
          body_path: notes.md
          files: artifacts/*
